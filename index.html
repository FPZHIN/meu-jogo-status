<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Status · IA dos Personagens</title>
<style>
:root{--bg:#fff;--sf:#eef0f5;--tx:#12141a;--mu:#737889;--ac:#5b52ff;--bd:#dfe2ea;--bad:#e5484d;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0b0f14;--sf:#1a1f29;--tx:#f2f4f8;--mu:#8b92a5;--bd:#232938;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
#app{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button,input,textarea{font:inherit;color:inherit}
input,textarea{width:100%;background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:10px}
button{background:var(--sf);border:0;border-radius:12px;padding:9px 14px;cursor:pointer}
button.pr{background:var(--ac);color:#fff;font-weight:700}
button:disabled{opacity:.45}
header{padding:12px 14px;border-bottom:1px solid var(--bd);display:flex;gap:8px;align-items:center}
header b{font-size:22px;font-style:italic;flex:1}
.tab.on{background:var(--ac);color:#fff}
.chips{display:flex;gap:10px;overflow-x:auto;padding:10px 14px}
.chip{flex:none;width:62px;text-align:center;font-size:12px;cursor:pointer;opacity:.6;background:none;padding:0}
.chip.on{opacity:1}
.av{width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;color:#fff;margin:0 auto 4px;border:2px solid transparent}
.chip.on .av{border-color:var(--ac)}
.who{padding:0 14px 8px}.mu{color:var(--mu);font-size:13px}
#msgs{flex:1;overflow-y:auto;padding:8px 14px;display:flex;flex-direction:column;gap:6px}
.b{max-width:82%;padding:8px 12px;border-radius:16px;white-space:pre-wrap;word-wrap:break-word}
.b.u{background:var(--ac);color:#fff;align-self:flex-end}
.b.m{background:var(--sf);align-self:flex-start}
.row{display:flex;gap:8px;padding:10px 14px}
.p{padding:14px}.card{background:var(--sf);border-radius:14px;padding:14px;margin-top:12px}
.card h3{margin:0 0 4px}.tag{display:inline-block;background:var(--bg);border-radius:10px;padding:2px 9px;margin:2px 3px 0 0;font-size:12px}
.err{color:var(--bad);padding:6px 14px}
</style>
</head>
<body>
<div id="app">
  <header>
    <b>Status IA</b>
    <button class="tab on" id="t1" onclick="show('chat')">💬 Chat</button>
    <button class="tab" id="t2" onclick="show('gen')">✨ Perfis</button>
  </header>

  <section id="chat" style="display:flex;flex-direction:column;flex:1;min-height:0">
    <div class="chips" id="chips"></div>
    <div class="who" id="who"></div>
    <div id="msgs"></div>
    <div class="err" id="cerr"></div>
    <div class="row">
      <input id="inp" placeholder="Escreva uma mensagem…" maxlength="500" onkeydown="if(event.key==='Enter')send()">
      <button class="pr" id="sendb" onclick="send()">Enviar</button>
    </div>
    <div class="row" style="padding-top:0"><button onclick="clearChat()" class="mu">Limpar conversa</button></div>
  </section>

  <section id="gen" class="p" style="display:none">
    <p class="mu">Gere um perfil fictício completo (nome, bio, personalidade e história). Depois adicione aos personagens para conversar com ele.</p>
    <textarea id="idea" rows="2" maxlength="200" placeholder="Ideia opcional (ex.: barista de Recife que ama skate)"></textarea>
    <button class="pr" id="genb" style="width:100%;margin-top:8px;padding:12px" onclick="gerar()">✨ Gerar perfil</button>
    <div class="err" id="gerr"></div>
    <div id="result"></div>
  </section>
</div>

<script>
const BASE=[
['Larissa',24,'Estudante de pedagogia, sorridente, cabelo cacheado castanho','Simpática e comunicativa, adora crianças e falar de educação. Ri fácil.'],
['Pedro',28,'Trabalha com tecnologia, calmo, barba curta','Calmo e analítico, fala pouco, humor seco. Curte tecnologia e café.'],
['Mariana',26,'Ama arte e música, cabelo longo escuro, estilo levemente boêmio','Sonhadora e criativa, fala de arte e música, meio boêmia.'],
['Lucas',30,'Atleta, simpático, cabelo curto, esportivo','Energético e motivador, fala de treino e esporte, muito simpático.'],
['Júlia',22,'Apaixonada por viagens e praia, cabelo com mechas claras','Aventureira e solar, sempre planejando a próxima viagem.'],
['Rafael',32,'Profissional de escritório, elegante, barba feita','Educado e objetivo, elegante, fala de carreira e organização.'],
['Camila',27,'Criativa, cabelo curto com estilo, maquiagem leve','Criativa e animada, cheia de ideias, gosta de moda e design.'],
['Gabriel',23,'Universitário, cabelo encaracolado, óculos, jovem','Tímido e curioso, fala de estudos e séries.'],
['Beatriz',29,'Forte e determinada, cabelo liso escuro, sem maquiagem pesada','Determinada e direta, sem rodeios, mas gentil.'],
['Thiago',35,'Maduro e tranquilo, cabelo com alguns fios grisalhos','Tranquilo e maduro, dá conselhos com calma.'],
['Sofia',21,'Alegre e extrovertida, cabelo castanho claro, sardas leves','Extrovertida e brincalhona, fala rápido, cheia de emojis.'],
['Enzo',25,'Moderno, cabelo com estilo, jaqueta, jovem urbano','Descolado e confiante, curte música urbana e rolês.'],
['Isabela',31,'Calma e acolhedora, cabelo médio ondulado, tom de pele morena','Acolhedora e calma, escuta bem, fala com carinho.'],
['Felipe',27,'Descontraído, sorriso fácil, sem barba, camiseta estampada simples','Descontraído, sempre de bom humor, faz piada de tudo.'],
['Manuela',23,'Doce e sonhadora, cabelo longo com ondas, flor no cabelo ou tiara','Doce e sonhadora, romântica, fala devagar e com delicadeza.']
].map(([nome,idade,bio,personalidade])=>({nome,idade,bio,personalidade,historia:'',estilo_de_fala:''}));

const $=id=>document.getElementById(id);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};

let extra=load('gx-chars',[]),hist=load('gx-hist',{}),cur=0,last=null;
const chars=()=>[...BASE,...extra];
const color=i=>`hsl(${i*57+210},45%,38%)`;

async function api(path,body){
  const r=await fetch('/api/'+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(d.error||'Erro '+r.status);
  return d;
}

function show(v){
  $('chat').style.display=v==='chat'?'flex':'none';
  $('gen').style.display=v==='gen'?'block':'none';
  $('t1').classList.toggle('on',v==='chat');$('t2').classList.toggle('on',v==='gen');
}

function drawChips(){
  $('chips').innerHTML=chars().map((c,i)=>`<button class="chip ${i===cur?'on':''}" onclick="pick(${i})"><div class="av" style="background:${color(i)}">${esc(c.nome[0])}</div>${esc(c.nome.split(' ')[0])}</button>`).join('');
}
function drawChat(){
  const c=chars()[cur];
  $('who').innerHTML=`<b>${esc(c.nome)}</b>, ${esc(c.idade)} anos<div class="mu">${esc(c.bio)}</div>`;
  const h=hist[c.nome]||[];
  $('msgs').innerHTML=h.length?h.map(m=>`<div class="b ${m.role==='user'?'u':'m'}">${esc(m.text)}</div>`).join(''):`<div class="mu" style="text-align:center;margin-top:20px">Diga oi para ${esc(c.nome)} 👋</div>`;
  $('msgs').scrollTop=1e9;
}
function pick(i){cur=i;$('cerr').textContent='';drawChips();drawChat()}
function clearChat(){delete hist[chars()[cur].nome];save('gx-hist',hist);drawChat()}

async function send(){
  const text=$('inp').value.trim();if(!text)return;
  const c=chars()[cur],h=hist[c.nome]=hist[c.nome]||[];
  $('cerr').textContent='';$('inp').value='';
  const before=h.slice(-12);
  h.push({role:'user',text});drawChat();
  $('msgs').insertAdjacentHTML('beforeend','<div class="b m mu" id="typ">digitando…</div>');$('msgs').scrollTop=1e9;
  $('sendb').disabled=true;
  try{
    const d=await api('chat',{persona:c,history:before,message:text});
    h.push({role:'model',text:d.reply});
  }catch(e){$('cerr').textContent=e.message}
  save('gx-hist',hist);$('sendb').disabled=false;drawChat();
}

async function gerar(){
  $('gerr').textContent='';$('genb').disabled=true;$('genb').textContent='Gerando…';
  try{
    last=await api('profile',{ideia:$('idea').value,evitar:chars().map(c=>c.nome)});
    const p=last;
    $('result').innerHTML=`<div class="card"><h3>${esc(p.nome)}, ${esc(p.idade)}</h3><div class="mu">${esc(p.bio)}</div>
    <p><b>Personalidade:</b> ${esc(p.personalidade)}</p><p><b>História:</b> ${esc(p.historia)}</p>
    <p><b>Estilo de fala:</b> ${esc(p.estilo_de_fala)}</p><div>${p.interesses.map(i=>`<span class="tag">${esc(i)}</span>`).join('')}</div>
    <p class="mu"><b>Prompt da foto:</b> ${esc(p.foto_prompt)}</p>
    <div class="row" style="padding:0"><button class="pr" onclick="addChar()">➕ Adicionar aos personagens</button><button onclick="copyJson()">Copiar JSON</button></div></div>`;
  }catch(e){$('gerr').textContent=e.message}
  $('genb').disabled=false;$('genb').textContent='✨ Gerar perfil';
}
function addChar(){
  if(!last)return;
  extra.push(last);save('gx-chars',extra);cur=chars().length-1;last=null;
  $('result').innerHTML='';show('chat');drawChips();drawChat();
}
async function copyJson(){
  try{await navigator.clipboard.writeText(JSON.stringify(last,null,2));alert('JSON copiado!')}catch(e){prompt('Copie o JSON:',JSON.stringify(last))}
}
drawChips();drawChat();
</script>
</body>
</html>
